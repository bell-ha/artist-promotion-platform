[pytest]
testpaths = tests
asyncio_mode = auto
# app/database.py가 임포트 시점에 엔진을 만들고 커넥션 풀을 잡는다.
# 테스트마다 이벤트 루프를 새로 만들면 그 풀이 닫힌 루프를 참조해서
# "Event loop is closed"가 난다. 그래서 루프를 세션 하나로 공유한다.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
